name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exactly the dependencies the suite needs: pytest to run it, ruff + mypy for the
      # static checks, pyyaml for the manifest/catalog-entry guards, and fastapi for the
      # dashboard-backend tests (those skip when it is absent).
      - name: Install test dependencies
        run: pip install "pytest>=8,<10" "ruff>=0.6,<1" "mypy>=1.11,<2" "pyyaml>=6,<7" "fastapi>=0.110,<1"
      - name: Ruff linter
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Unit and integration tests
        run: pytest
